    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('Fondo.jpg');

            margin: 0;
            padding: 0;

        header {
            background-image: url('FondoTitulo.jpg');
            background-size: cover;
            text-align: center;
            padding: 50px 0;
        }
        header h1 {
            color: black;

        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .game-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 10px;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-card img {
            width: auto;
            height: 150px;
            margin: auto;
            border-radius: 10px;
        }
        .game-card a {
            text-decoration: none;
        }
        .game-card p {
            margin-top: auto;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }
        .game-card:hover {
            transform: scale(1.05);
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .pagination span {
            font-weight: bold;
            color: black;
        }
    </style>
</head>
