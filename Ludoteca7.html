<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludoteca - Página 7</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('Fondo.jpg');
            background-size: cover;
            margin: 0;
            padding: 0;
        }
        header {
            background-image: url('FondoTitulo.jpg');
            background-size: cover;
            text-align: center;
            padding: 50px 0;
        }
        header h1 {
            color: black;
            font-size: 3em;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .game-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 10px;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-card img {
            width: auto;
            height: 150px;
            margin: auto;
            border-radius: 10px;
        }
        .game-card a {
            text-decoration: none;
        }
        .game-card p {
            margin-top: auto;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }
        .game-card:hover {
            transform: scale(1.05);
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .pagination span {
            font-weight: bold;
            color: black;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ludoteca</h1>
    </header>
    <div class="grid">
        
        <div class="game-card">
            <a href="#">
                <img src="canicas1.jpg" alt="Canicas">
                <p>Canicas</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="cuboRubik3x3.jpg" alt="Cubo Rubik 3x3">
                <p>Cubo Rubik 3x3</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="tiroAlBlanco1.jpg" alt="Tiro al blanco">
                <p>Tiro al blanco</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="dominoResina1.jpg" alt="Domino de resina">
                <p>Domino clásio de resina transparente</p>
            </a>
        </div>
    </div>
    <div class="pagination">
        <a href="Ludoteca6.html">ANTERIOR</a> <a href="Ludoteca.html">1</a> <a href="Ludoteca2.html">2</a> <a href="Ludoteca3.html">3</a> <a href="Ludoteca4.html">4</a> <a href="Ludoteca5.html">5</a> <a href="Ludoteca6.html">6</a> <span>7</span>
    </div>
</body>
</html>
