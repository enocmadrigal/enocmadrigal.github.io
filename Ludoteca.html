<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludoteca</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('Fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        header {
            background-image: url('FondoTitulo.jpg');
            background-size: cover;
            width: 100%;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .game-card {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background-color: #fff;
            min-height: 300px;
            transition: transform 0.2s;
            flex-grow: 1;
        }
        .game-card:hover {
            transform: scale(1.05);
        }
        .game-card img {
            max-width: 100%;
            height: auto;
            max-height: 270px;
            object-fit: contain;
            margin-bottom: auto;
        }
        .game-card a {
            text-decoration: none;
            color: inherit;
        }
        .game-card p {
            margin: 10px 0 0;
            font-weight: bold;
            color: #000;
        }
        .pagination {
            text-align: center;
            margin: 20px;
        }
        .pagination a {
            margin: 0 5px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        .pagination a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .game-card {
                min-height: 250px;
            }

            .game-card img {
                max-height: 230px;
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px;
            }

            .game-card {
                min-height: 220px;
            }

            .game-card img {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Ludoteca</h1>
    </header>
    <div class="grid">
        <div class="game-card">
            <a href="WeAreNotReallyStrangers.html">
                <img src="weAreNotReallyStrangers1.jpg" alt="We´re not really strangers">
                <p>We´re not really strangers</p>
            </a>
        </div>
        <div class="game-card">
            <a href="TemasDeSobremesa.html">
                <img src="temasDeSobremesa1.jpg" alt="Temas de sobremesa">
                <p>Temas de sobremesa</p>
            </a>
        </div>
        <div class="game-card">
            <a href="LIAR.html">
                <img src="liar1.jpg" alt="LIAR - Descubre al mentiroso">
                <p>LIAR - Descubre al mentiroso</p>
            </a>
        </div>
        <div class="game-card">
            <a href="MejorPeorAmigo.html">
                <img src="mejorPeorAmigo1.jpg" alt="Mejor/peor amig@">
                <p>Mejor/peor amig@</p>
            </a>
        </div>
        <div class="game-card">
            <a href="AlChile.html">
                <img src="alChile1.jpg" alt="AL CHILE">
                <p>AL CHILE</p>
            </a>
        </div>
        <div class="game-card">
            <a href="CatanPlus.html">
                <img src="catanPlus1.jpg" alt="Catan plus">
                <p>Catan plus</p>
            </a>
        </div>
        <div class="game-card">
            <a href="CatanNavegantes.html">
                <img src="catanNavegantes1.jpg" alt="Catan - Expansión navegantes">
                <p>Catan - Expansión navegantes</p>
            </a>
        </div>
        <div class="game-card">
            <a href="TuristaDeLaSuerte.html">
                <img src="turistaDeLaSuerte1.jpg" alt="Turista de la suerte">
                <p>Turista de la suerte</p>
            </a>
        </div>
    </div>
    <div class="pagination">
        <a href="Ludoteca2.html">Siguiente</a>
    </div>
</body>
</html>
