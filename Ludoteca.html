<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludoteca - Página 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('Fondo.jpg');
            background-size: cover;
            margin: 0;
            padding: 0;
        }
        header {
            background-image: url('FondoTitulo.jpg');
            background-size: cover;
            text-align: center;
            padding: 50px 0;
        }
        header h1 {
            color: white;
            font-size: 3em;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .game-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 10px;
            transition: transform 0.2s;
        }
        .game-card img {
            width: 100%;
            border-radius: 10px;
        }
        .game-card p {
            margin: 10px 0 0;
            font-weight: bold;
            color: #333;
        }
        .game-card:hover {
            transform: scale(1.05);
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .pagination select {
            padding: 5px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ludoteca</h1>
    </header>
    <div class="grid">
        <div class="game-card">
            <a href="WeAreNotReallyStrangers.html">
                <img src="weAreNotReallyStrangers1.jpg" alt="We´re not really strangers">
                <p>We´re not really strangers</p>
            </a>
        </div>
        <div class="game-card">
            <a href="TemasDeSobremesa.html">
                <img src="temasDeSobremesa1.jpg" alt="Temas de sobremesa">
                <p>Temas de sobremesa</p>
            </a>
        </div>
        <div class="game-card">
            <a href="Liar.html">
                <img src="liar1.jpg" alt="LIAR - Descubre al mentiroso">
                <p>LIAR - Descubre al mentiroso</p>
            </a>
        </div>
        <div class="game-card">
            <a href="MejorPeorAmigo.html">
                <img src="mejorPeorAmigo1.jpg" alt="Mejor/peor amig@">
                <p>Mejor/peor amig@</p>
            </a>
        </div>
        <div class="game-card">
            <a href="AlChile.html">
                <img src="alChile1.jpg" alt="AL CHILE">
                <p>AL CHILE</p>
            </a>
        </div>
        <div class="game-card">
            <a href="CatanPlus.html">
                <img src="catanPlus1.jpg" alt="Catan plus">
                <p>Catan plus</p>
            </a>
        </div>
        <div class="game-card">
            <a href="CatanNavegantes.html">
                <img src="catanNavegantes1.jpg" alt="Catan - Expansión navegantes">
                <p>Catan - Expansión navegantes</p>
            </a>
        </div>
        <div class="game-card">
            <a href="TuristaDeLaSuerte.html">
                <img src="turistaDeLaSuerte1.jpg" alt="Turista de la suerte">
                <p>Turista de la suerte</p>
            </a>
        </div>
    </div>
    <div class="pagination">
        <a href="Ludoteca7.html">Anterior</a>
        <a href="Ludoteca2.html">Siguiente</a>
        <select onchange="location = this.value;">
            <option value="Ludoteca1.html" selected>Página 1</option>
            <option value="Ludoteca2.html">Página 2</option>
            <option value="Ludoteca3.html">Página 3</option>
            <option value="Ludoteca4.html">Página 4</option>
            <option value="Ludoteca5.html">Página 5</option>
            <option value="Ludoteca6.html">Página 6</option>

        </select>

</body>
</html>
