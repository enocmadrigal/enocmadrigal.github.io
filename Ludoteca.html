<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludoteca - Página 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('Fondo.jpg');
            background-size: cover;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Barra del Título */
        header {
            background-image: url('FondoTitulo.jpg');
            background-size: cover;
            background-position: center;
            text-align: center;
            padding: 50px 0;
            width: 100%;
            margin: 0;
            box-sizing: border-box;
        }

        header h1 {
            color: black;
            font-size: 3em;
            margin: 0;
        }

        /* Grid de Juegos */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columnas por defecto */
            gap: 20px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Responsividad para dispositivos móviles */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr); /* Cambia a 2 columnas */
                padding: 10px;
            }

            header {
                padding: 30px 0; /* Ajusta el padding en pantallas pequeñas */
            }
        }

        /* Estilo para las tarjetas de juegos */
        .game-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 10px;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%; /* Asegura que ocupe todo el ancho disponible */
            max-width: 100%; /* Evita que se exceda el ancho de la pantalla */
        }

        .game-card img {
            width: 100%; /* Ajusta la imagen al 100% del contenedor */
            height: auto; /* Mantiene la proporción de la imagen */
            border-radius: 10px;
            max-width: 100%; /* Impide que la imagen exceda el tamaño de su contenedor */
        }

        .game-card a {
            text-decoration: none;
        }

        .game-card p {
            margin-top: auto;
            font-weight: bold;
            color: #333;
        }

        .game-card:hover {
            transform: scale(1.05);
        }

        /* Paginación */
        .pagination {
            text-align: center;
            margin: 20px 0 40px; /* Ajusta el margen inferior para darle espacio */
        }

        .pagination a, .pagination span {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .pagination span {
            font-weight: bold;
            color: black;
        }

        /* Asegurar que la paginación no quede pegada al borde */
        @media (max-width: 768px) {
            .pagination {
                margin-bottom: 20px; /* Espacio extra abajo */
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Ludoteca</h1>
    </header>
    <div class="grid">
        <div class="game-card">
            <a href="#">
                <img src="weAreNotReallyStrangers1.jpg" alt="We´re not really strangers">
                <p>We´re not really strangers</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="temasDeSobremesa1.jpg" alt="Temas de sobremesa">
                <p>Temas de sobremesa</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="liar1.jpg" alt="LIAR - Descubre al mentiroso">
                <p>LIAR - Descubre al mentiroso</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="mejorPeorAmigo1.jpg" alt="Mejor/peor amig@">
                <p>Mejor/peor amig@</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="alChile1.jpg" alt="AL CHILE">
                <p>AL CHILE</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="catanPlus1.jpg" alt="Catan plus">
                <p>Catan plus</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="catanNavegantes1.jpg" alt="Catan - Expansión navegantes">
                <p>Catan - Expansión navegantes</p>
            </a>
        </div>
        <div class="game-card">
            <a href="#">
                <img src="turistaDeLaSuerte1.jpg" alt="Turista de la suerte">
                <p>Turista de la suerte</p>
            </a>
        </div>
    </div>
    <div class="pagination">
        <span>1</span>
        <a href="Ludoteca2.html">2</a>
        <a href="Ludoteca3.html">3</a>
        <a href="Ludoteca4.html">4</a>
        <a href="Ludoteca5.html">5</a>
        <a href="Ludoteca6.html">6</a>
        <a href="Ludoteca7.html">7</a>
        <a href="Ludoteca2.html">SIGUIENTE</a>
    </div>
</body>
</html>
