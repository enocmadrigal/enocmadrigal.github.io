<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludoteca</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('Fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        header {
            background-image: url('FondoTitulo.jpg');
            background-size: cover;
            width: 100%; /* Asegura que el fondo del título cubra toda la pantalla */
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .game-card {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background-color: #fff;
            min-height: 300px; /* Cambié 'height' por 'min-height' */
            transition: transform 0.2s;
            flex-grow: 1; /* Permite que la tarjeta crezca de manera proporcional */
        }
        .game-card:hover {
            transform: scale(1.05);
        }
        .game-card img {
            max-width: 100%;
            height: auto;
            max-height: 270px;
            object-fit: contain;
            margin-bottom: auto;
        }
        .game-card a {
            text-decoration: none;
            color: inherit;
        }
        .game-card p {
            margin: 10px 0 0;
            font-weight: bold;
            color: #000;
        }
        .pagination {
            text-align: center;
            margin: 20px;
        }
        .pagination a {
            margin: 0 5px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        .pagination a:hover {
            text-decoration: underline;
        }

        /* Estilo responsive para pantallas pequeñas */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr); /* Dos columnas en pantallas pequeñas */
                gap: 15px;
            }

            .game-card {
                min-height: 250px; /* Ajustar la altura mínima de las tarjetas en pantallas pequeñas */
            }

            .game-card img {
                max-height: 230px; /* Reducir el tamaño máximo de las imágenes en pantallas pequeñas */
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr; /* Una columna en pantallas muy pequeñas */
            }

            header {
                padding: 15px;
            }

            .game-card {
                min-height: 220px; /* Ajustar aún más la altura mínima de las tarjetas en pantallas muy pequeñas */
            }

            .game-card img {
                max-height: 200px; /* Reducir aún más el tamaño de las imágenes en pantallas muy pequeñas */
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Ludoteca</h1>
    </header>
    <div class="grid">
        <!-- Fila 1 -->
        <div class="game-card">
            <a href="100mexicanosDijeron1.jpg">
                <img src="100mexicanosDijeron1.jpg" alt="Juego 1">
                <p>100 mexicanos dijeron</p>
            </a>
        </div>
        <div class="game-card">
            <a href="Juego2.html">
                <img src="aSusMarcas1.jpg" alt="Juego 2">
                <p>A sus marcas!</p>
            </a>
        </div>
        <div class="game-card">
            <a href="Juego3.html">
                <img src="backgammon.jpg" alt="Juego 3">
                <p>Backgammon</p>
            </a>
        </div>
        <div class="game-card">
            <a href="Juego4.html">
                <img src="bastaOriginal.jpg" alt="Juego 4">
                <p>Basta Original</p>
            </a>
        </div>
        <!-- Fila 2 -->
        <div class="game-card">
            <a href="Juego5.html">
                <img src="catán.jpg" alt="Juego 5">
                <p>Catán</p>
            </a>
        </div>
        <div class="game-card">
            <a href="Juego6.html">
                <img src="dixit.jpg" alt="Juego 6">
                <p>Dixit</p>
            </a>
        </div>
        <div class="game-card">
            <a href="Juego7.html">
                <img src="uno.jpg" alt="Juego 7">
                <p>UNO</p>
            </a>
        </div>
        <div class="game-card">
            <a href="Juego8.html">
                <img src="monopoly.jpg" alt="Juego 8">
                <p>Monopoly</p>
            </a>
        </div>
    </div>
    <div class="pagination">
        <a href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">Siguiente</a>
    </div>
</body>
</html>
