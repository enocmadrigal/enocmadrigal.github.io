<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle del Juego</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 id="game-title">Juego</h1>

  <div class="detalle-container">
    <!-- Imagen principal -->
    <img id="game-image" src="" alt="Imagen del juego">

    <!-- Información del juego -->
    <div class="game-info">
      <p><strong>Editorial:</strong> <span id="game-publisher"></span></p>
      <p><strong>Categoría(s):</strong> <span id="game-categories"></span></p>
      <p><strong>Jugadores:</strong> <span id="game-players"></span></p>
      <p><strong>Duración:</strong> <span id="game-duration"></span></p>
      <p><strong>Modalidad:</strong> <span id="game-mode"></span></p>
      <p><strong>Descripción:</strong> <span id="game-description"></span></p>
      <p><strong>Reglas:</strong> <span id="game-rules"></span></p>
    </div>

    <!-- Videos -->
    <div class="game-videos">
      <h3>Video tutorial</h3>
      <video id="game-video" controls width="480">
        <source src="public/assets/videos/catan.mp4" type="video/mp4">
        Tu navegador no soporta video.
      </video>
    </div>

    <!-- Imágenes secundarias -->
    <div class="game-secondary-images" id="secondary-images">
      <img class="secondary-img" src="public/assets/images/catan_2.jpg" alt="Imagen secundaria 1">
      <img class="secondary-img" src="public/assets/images/catan_3.jpg" alt="Imagen secundaria 2">
    </div>

    <!-- Volver a Home -->
    <a href="index.html">← Volver a Ludoteca</a>
  </div>

  <!-- Ajuste ruta JS compilado -->
  <script type="module" src="dist/app.js"></script>
</body>
</html>
