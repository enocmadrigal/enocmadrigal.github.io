<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludoteca - Página 7</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: url('Fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }

        header {
            background: url('FondoTitulo.jpg') no-repeat center center;
            background-size: cover;
            text-align: center;
            padding: 60px 20px;
            color: black;
            text-shadow: 1px 1px 4px rgba(255,255,255,0.6);
        }

        header h1 {
            font-size: 3em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background-color: rgba(255,255,255,0.95);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .game-card img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .game-card p {
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 1.1em;
            flex-grow: 1;
        }

        .game-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 12px 20px rgba(0,0,0,0.3);
        }

        .pagination {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 30px 0;
        }

        .pagination a, .pagination span {
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s, color 0.3s;
        }

        .pagination a {
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
        }

        .pagination a:hover {
            background-color: #333;
            color: #fff;
        }

        .pagination span {
            background-color: #333;
            color: #fff;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Ludoteca</h1>
    </header>

    <div class="grid">
        <div class="game-card">
            <a href="#"><img src="canicas1.jpg" alt="Canicas"><p>Canicas</p></a>
        </div>
        <div class="game-card">
            <a href="#"><img src="cuboRubik3x3.jpg" alt="Cubo Rubik 3x3"><p>Cubo Rubik 3x3</p></a>
        </div>
        <div class="game-card">
            <a href="#"><img src="tiroAlBlanco1.jpg" alt="Tiro al blanco"><p>Tiro al blanco</p></a>
        </div>
        <div class="game-card">
            <a href="#"><img src="dominoResina.jpg" alt="Domino de resina"><p>Domino clásico de resina transparente</p></a>
        </div>
    </div>

    <div class="pagination">
        <a href="Ludoteca6.html">ANTERIOR</a>
        <a href="Ludoteca.html">1</a>
        <a href="Ludoteca2.html">2</a>
        <a href="Ludoteca3.html">3</a>
        <a href="Ludoteca4.html">4</a>
        <a href="Ludoteca5.html">5</a>
        <a href="Ludoteca6.html">6</a>
        <span>7</span>
    </div>
</body>
</html>
