<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludoteca - Página 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('Fondo.jpg');
            background-size: cover;
            margin: 0;
            padding: 0;
        }
        header {
            background-image: url('FondoTitulo.jpg');
            background-size: cover;
            text-align: center;
            padding: 50px 0;
        }
        header h1 {
            color: black;
            font-size: 3em;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .game-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 10px;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-card img {
            width: 100%;
            height: auto;
            margin: auto;
            border-radius: 10px;
        }
        .game-card p {
            margin: 10px 0 0;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }
        .game-card:hover {
            transform: scale(1.05);
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .pagination span {
            font-weight: bold;
            color: black;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ludoteca</h1>
    </header>
    <div class="grid">
        <!-- Juegos de esta página -->
    </div>
    <div class="pagination">
        <a href="Ludoteca.html">Anterior</a>
        <span>2</span>
        <a href="Ludoteca3.html">3</a>
        <a href="Ludoteca4.html">4</a>
        <a href="Ludoteca5.html">5</a>
        <a href="Ludoteca6.html">6</a>
        <a href="Ludoteca7.html">7</a>
        <a href="Ludoteca8.html">8</a>
        <a href="Ludoteca3.html">Siguiente</a>
    </div>
</body>
</html>
