<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ranking de Juegos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Ranking de Juegos</h1>

  <!-- Filtro de categorías para ranking -->
  <div class="ranking-filters">
    <select id="ranking-category">
      <option value="">Todas las categorías</option>
      <option value="Estrategia">Estrategia</option>
      <option value="Familiar">Familiar</option>
      <option value="Party">Party</option>
      <!-- Agregar más según tu metadata -->
    </select>
    <button id="apply-ranking">Aplicar</button>
  </div>

  <!-- Tabla de ranking -->
  <table id="ranking-table">
    <thead>
      <tr>
        <th>Ranking</th>
        <th>Juego</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <a href="index.html">← Volver a Ludoteca</a>

  <!-- Ajuste ruta JS compilado -->
  <script type="module" src="dist/app.js"></script>
</body>
</html>
